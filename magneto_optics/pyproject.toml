[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "periodicdebye-magnetooptics"
version = "0.1.0"
description = "Finite magneto-optical particle arrays with validated coupled electric dipoles"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.12", "threadpoolctl>=3"]

[project.optional-dependencies]
test = ["pytest>=7"]
report = ["matplotlib>=3.7", "psutil>=5"]

[project.scripts]
magnetooptics = "magnetooptics.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

